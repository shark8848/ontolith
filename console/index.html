<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ontolith Console</title>
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<div class="layout">
  <header>
    <h1>Ontolith Console</h1>
    <div class="header-tools">
      <select id="cluster-select" title="切换集群"></select>
      <div id="statusbar">
        <span class="dot" id="dot-gw" title="gateway"></span> gateway
        <span class="dot" id="dot-mg" title="management"></span> management
        <span id="refresh-note"></span>
      </div>
    </div>
  </header>
  <div class="shell">
    <aside class="sidebar">
      <nav>
        <button data-tab="overview" class="active"><svg class="icon"><use href="#icon-overview"></use></svg>概览</button>
        <button data-tab="monitor"><svg class="icon"><use href="#icon-monitor"></use></svg>监控</button>
        <button data-tab="sparql"><svg class="icon"><use href="#icon-sparql"></use></svg>SPARQL</button>
        <button data-tab="data"><svg class="icon"><use href="#icon-data"></use></svg>数据</button>
        <button data-tab="cluster"><svg class="icon"><use href="#icon-cluster"></use></svg>集群</button>
        <button data-tab="infer"><svg class="icon"><use href="#icon-infer"></use></svg>推理</button>
        <button data-tab="plugins"><svg class="icon"><use href="#icon-plugins"></use></svg>插件</button>
        <button data-tab="audit"><svg class="icon"><use href="#icon-audit"></use></svg>审计</button>
        <button data-tab="traces"><svg class="icon"><use href="#icon-traces"></use></svg>追踪</button>
        <button data-tab="config"><svg class="icon"><use href="#icon-config"></use></svg>配置</button>
      </nav>
    </aside>
    <main>
      <section id="tab-overview" class="tab active"></section>
      <section id="tab-monitor" class="tab"></section>
      <section id="tab-cluster" class="tab"></section>
      <section id="tab-sparql" class="tab"></section>
      <section id="tab-data" class="tab"></section>
      <section id="tab-infer" class="tab"></section>
      <section id="tab-plugins" class="tab"></section>
      <section id="tab-audit" class="tab"></section>
      <section id="tab-traces" class="tab"></section>
      <section id="tab-config" class="tab"></section>
    </main>
  </div>
</div>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="icon-overview" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect>
    <rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect>
  </symbol>
  <symbol id="icon-monitor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
  </symbol>
  <symbol id="icon-sparql" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line>
  </symbol>
  <symbol id="icon-data" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
    <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
    <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
  </symbol>
  <symbol id="icon-cluster" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle>
    <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
  </symbol>
  <symbol id="icon-infer" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><rect x="9" y="9" width="6" height="6"></rect>
    <line x1="9" y1="1" x2="9" y2="4"></line><line x1="15" y1="1" x2="15" y2="4"></line>
    <line x1="9" y1="20" x2="9" y2="23"></line><line x1="15" y1="20" x2="15" y2="23"></line>
    <line x1="20" y1="9" x2="23" y2="9"></line><line x1="20" y1="14" x2="23" y2="14"></line>
    <line x1="1" y1="9" x2="4" y2="9"></line><line x1="1" y1="14" x2="4" y2="14"></line>
  </symbol>
  <symbol id="icon-plugins" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
    <polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline>
  </symbol>
  <symbol id="icon-audit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
  </symbol>
  <symbol id="icon-traces" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="6" y1="3" x2="6" y2="15"></line><circle cx="18" cy="6" r="3"></circle>
    <circle cx="6" cy="18" r="3"></circle><path d="M18 9a9 9 0 0 1-9 9"></path>
  </symbol>
  <symbol id="icon-config" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3"></circle>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
  </symbol>
</svg>
<div id="login-overlay" class="hidden">
  <div class="login-card">
    <h2>Ontolith Console 访问令牌</h2>
    <input type="password" id="login-token" placeholder="CONSOLE_AUTH_TOKEN">
    <button class="run" id="login-btn">进入</button>
    <p id="login-msg" class="muted"></p>
  </div>
</div>
<script type="module" src="/src/app.js"></script>
</body>
</html>

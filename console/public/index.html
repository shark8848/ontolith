<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ontolith Console</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>Ontolith Console</h1>
  <div id="statusbar">
    <span class="dot" id="dot-gw" title="gateway"></span> gateway
    <span class="dot" id="dot-mg" title="management"></span> management
    <span id="refresh-note"></span>
  </div>
  <nav>
    <button data-tab="overview" class="active">概览</button>
    <button data-tab="cluster">集群</button>
    <button data-tab="sparql">SPARQL</button>
    <button data-tab="data">数据</button>
    <button data-tab="audit">审计</button>
    <button data-tab="traces">追踪</button>
    <button data-tab="config">配置</button>
  </nav>
</header>
<main>
  <section id="tab-overview" class="tab active"></section>
  <section id="tab-cluster" class="tab"></section>
  <section id="tab-sparql" class="tab"></section>
  <section id="tab-data" class="tab"></section>
  <section id="tab-audit" class="tab"></section>
  <section id="tab-traces" class="tab"></section>
  <section id="tab-config" class="tab"></section>
</main>
<script src="/app.js"></script>
</body>
</html>

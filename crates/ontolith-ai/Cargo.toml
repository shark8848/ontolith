[package]
name = "ontolith-ai"
version = "0.1.0"
edition = "2024"

[features]
default = ["rocksdb-backend"]
rocksdb-backend = ["ontolith-storage/rocksdb-backend"]

[dependencies]
ontolith-core = { path = "../ontolith-core" }
ontolith-rdf = { path = "../ontolith-rdf" }
ontolith-storage = { path = "../ontolith-storage", default-features = false }
ontolith-plugin-api = { path = "../ontolith-plugin-api" }

[dev-dependencies]
tempfile = "3.14.0"

[[bench]]
name = "semantic_bench"
harness = false

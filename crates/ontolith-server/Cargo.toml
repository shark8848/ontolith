[package]
name = "ontolith-server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ontolith-server"
path = "src/main.rs"

[[bin]]
name = "ontolith-management-server"
path = "src/bin/ontolith-management-server.rs"

[features]
default = ["rocksdb-backend", "raft-backend", "grpc-backend"]
rocksdb-backend = ["ontolith-storage/rocksdb-backend"]
raft-backend = ["ontolith-cluster/raft-backend"]
grpc-backend = ["dep:tonic", "dep:prost", "dep:tokio", "dep:tonic-build", "dep:protoc-bin-vendored"]

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2.2.0"
tonic = { version = "0.12", optional = true }
prost = { version = "0.13", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"], optional = true }
ontolith-core = { path = "../ontolith-core" }
ontolith-query = { path = "../ontolith-query" }
ontolith-storage = { path = "../ontolith-storage" }
ontolith-transaction = { path = "../ontolith-transaction" }
ontolith-cluster = { path = "../ontolith-cluster" }
ontolith-security = { path = "../ontolith-security" }
ontolith-observability = { path = "../ontolith-observability" }
ontolith-reasoner = { path = "../ontolith-reasoner" }
ontolith-plugin-api = { path = "../ontolith-plugin-api" }
ontolith-sdk = { path = "../ontolith-sdk" }
ontolith-rdf = { path = "../ontolith-rdf" }
ontolith-parser = { path = "../ontolith-parser" }
ontolith-ai = { path = "../ontolith-ai" }
serde_json = "1"

[build-dependencies]
tonic-build = { version = "0.12", optional = true }
protoc-bin-vendored = { version = "3", optional = true }

[dev-dependencies]
tempfile = "3.14.0"
rcgen = "0.13.2"

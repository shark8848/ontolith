[package]
name = "ontolith-cluster"
version = "0.1.0"
edition = "2024"

[features]
default = ["raft-backend"]
raft-backend = ["dep:openraft", "dep:tokio", "dep:serde", "dep:serde_json", "ontolith-storage/rocksdb-backend"]

[dependencies]
openraft = { version = "=0.9.25", features = ["serde"], optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "macros", "sync"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
ontolith-core = { path = "../ontolith-core" }
ontolith-transaction = { path = "../ontolith-transaction" }
ontolith-storage = { path = "../ontolith-storage" }

[dev-dependencies]
tempfile = "3.14.0"
